{% extends 'layout.html' %}
{% block content %}
<h2>用户登录</h2>
<form method="post">
  <div class="mb-3">
    <label>用户名</label>
    <input type="text" name="username" class="form-control" required>
  </div>
  <div class="mb-3">
    <label>密码</label>
    <input type="password" name="password" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-primary">登录</button>
</form>
<p class="mt-3">没有账号？<a href="/register">点此注册</a></p>
{% endblock %}
